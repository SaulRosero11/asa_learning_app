# ============================================================
# ASA E-Learning Platform — Configuración Base
# Usar variables de entorno para sobreescribir valores en producción
# ============================================================

spring.application.name=asa-e-learning
server.port=8080

# ===== BASE DE DATOS =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/asa_elearning}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / HIBERNATE =====
# Flyway gestiona el esquema; Hibernate solo valida
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== FLYWAY =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ===== SEGURIDAD / JWT =====
asa.jwt.secret=${JWT_SECRET:cambia-este-secreto-en-produccion-minimo-32-caracteres}
asa.jwt.access-expiration-ms=900000
asa.jwt.refresh-expiration-short-ms=1800000
asa.jwt.refresh-expiration-long-ms=2592000000

# ===== GOOGLE OAUTH2 =====
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ===== DOMINIO AUTORIZADO PARA ROLES ELEVADOS =====
asa.auth.allowed-admin-domain=${ASA_AUTH_ALLOWED_ADMIN_DOMAIN:solidaridadyaccion.org}

# ===== SEED ADMIN =====
asa.seed.admin-email=${ASA_SEED_ADMIN_EMAIL:admin@solidaridadyaccion.org}

# ===== EMAIL / SMTP =====
spring.mail.host=${MAIL_HOST:smtp.hostinger.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:info@zefiro.app}
spring.mail.password=${MAIL_PASSWORD:S1999R10B19*s}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
asa.mail.from=${MAIL_FROM:info@zefiro.app}

# ===== FRONTEND URL (para links en emails) =====
asa.frontend.url=${FRONTEND_URL:http://localhost:3000}

# ===== CORS =====
asa.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ===== SWAGGER / OPENAPI =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true

# ===== LOGGING =====
logging.level.com.springboot.asa.learning=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO

# ===== SPRINGDOC / SWAGGER =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method
